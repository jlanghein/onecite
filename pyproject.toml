[project]
name = "onecite"
version = "0.1.0"
description = "Cite one source per fact, and refuse to cite a source that does not support it"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "inline-snapshot>=0.14", "dirty-equals>=0.8", "ruff>=0.15", "ty>=0.0.1a10"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onecite"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RET", "PTH", "ARG", "ERA", "TRY", "EM"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["onecite", "tests"]

[tool.ruff.lint.per-file-ignores]
# A fake's signature must match the Protocol it stands in for, unused args and all.
"tests/*" = ["ARG001", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
